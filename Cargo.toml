[package]
name = "acp-debugger"
description = "A desktop debugger for the Agent Client Protocol (ACP)"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "1.0.102"
futures = "0.3"
log = "0.4"
gpui-kit = "0.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
